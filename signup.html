<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - TAAGC</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body><!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2 class="brand">TAAGC</h2>

  <a href="/index.html">🏠 Home</a>
  <a href="/login.html">🔐 Login</a>
  <a href="/signup.html">📝 Sign Up</a>

  <hr>

  <p class="nav-title">Business Nature</p>
  <a href="#">🌾 General Agriculture</a>
  <a href="#">🌽 Grain Processing</a>
  <a href="#">💻 ICT</a>
  <a href="#">🏗️ General Contract</a>
  <a href="#">🛒 General Merchandise</a>

  <hr>

  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <button onclick="toggleSidebar()">☰</button>
  <span>TAAGC Global Platform</span>
</div>
  
<div class="main-content full" id="mainContent">
  <div class="card">
    <h2>Create Your Account</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <select id="role">
      <option value="client">Client</option>
      <option value="investor">Investor</option>
    </select>

    <button onclick="signup()">Sign Up</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script type="module">
import { auth, db } from './assets/js/firebase.js';
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

window.signup = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    await setDoc(doc(db, "users", user.uid), {
      email,
      role,
      verified: false,
      createdAt: new Date()
    });

    alert("Account created! Please wait for admin approval.");
    window.location.href = "login.html";
  } catch (error) {
    alert(error.message);
  }
};
</script>
  <script type="module" src="assets/js/sidebar.js"></script>

</body>
</html>
