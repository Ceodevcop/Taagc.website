<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Team | TAAGC</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    .org-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .level {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .member {
      background: #fff;
      border: 2px solid #0070f3;
      border-radius: 10px;
      padding: 10px 20px;
      margin: 0 15px;
      min-width: 120px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .connector {
      height: 40px;
      width: 2px;
      background: #0070f3;
      margin: 0 auto;
    }

    .horizontal-connector {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 -15px;
    }

    .horizontal-connector div {
      height: 2px;
      background: #0070f3;
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>TAAGC Organizational Chart</h1>

  <div class="org-chart">
    <!-- CEO -->
    <div class="member">CEO <br> Ahmad Hamza</div>
    <div class="connector"></div>

    <!-- President -->
    <div class="member">President <br> [Name]</div>
    <div class="connector"></div>

    <!-- CFO / COO / CTO -->
    <div class="level">
      <div class="member">CFO <br> [Name]</div>
      <div class="member">COO <br> [Name]</div>
      <div class="member">CTO/CIO <br> [Name]</div>
    </div>
    <div class="horizontal-connector">
      <div></div><div></div><div></div>
    </div>
    <div class="connector"></div>

    <!-- Dept Heads / Senior Managers -->
    <div class="level">
      <div class="member">Dept Head 1</div>
      <div class="member">Dept Head 2</div>
      <div class="member">Dept Head 3</div>
    </div>
    <div class="connector"></div>

    <!-- Middle Managers / Team Leads -->
    <div class="level">
      <div class="member">Team Lead 1</div>
      <div class="member">Team Lead 2</div>
      <div class="member">Team Lead 3</div>
    </div>
    <div class="connector"></div>

    <!-- Employees / Staff -->
    <div class="level">
      <div class="member">Employee 1</div>
      <div class="member">Employee 2</div>
      <div class="member">Employee 3</div>
      <div class="member">Employee 4</div>
      <div class="member">Employee 5</div>
    </div>
  </div>
</body>
</html>
