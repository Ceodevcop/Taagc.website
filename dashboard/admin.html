<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TAAGC</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <h1>Admin Dashboard</h1>

  <section>
    <h2>Edit Staff</h2>
    <textarea id="jsonEditor" style="width:100%;height:300px"></textarea>
    <button onclick="saveStaff()">Save Staff</button>
  </section>

  <section>
    <h2>Create User</h2>
    <input id="newUserEmail" placeholder="Email">
    <select id="newUserRole">
      <option value="admin">Admin</option>
      <option value="investor">Investor</option>
      <option value="client">Client</option>
    </select>
    <button onclick="createUser(document.getElementById('newUserEmail').value, document.getElementById('newUserRole').value)">Create User</button>
  </section>

  <!-- Scripts -->
  <script type="module" src="../assets/js/firebase.js"></script>
  <script type="module" src="../assets/js/jsonLoader.js"></script>
  <script type="module" src="../assets/js/admin.js"></script>
  <script type="module" src="../assets/js/audit.js"></script>
</body>
</html>
