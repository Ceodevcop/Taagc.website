<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <h1>Admin Dashboard</h1>
  <h2>Edit Staff</h2>
<textarea id="jsonEditor" style="width:100%;height:300px"></textarea>
<button onclick="saveJSON()">Save</button>

<script type="module">
  import { loadJSON } from "../assets/js/jsonLoader.js";

  const editor = document.getElementById("jsonEditor");

  loadJSON("/assets/json/staff.json").then(data => {
    editor.value = JSON.stringify(data, null, 2);
  });

  window.saveJSON = function () {
    alert("Frontend editing ready.\nNext step: connect backend API.");
  };
</script>
  
  <button onclick="createUser(prompt('Name:'), prompt('Email:'), prompt('Role (admin/investor/client):'))">Create User</button>

  <script type="module" src="../assets/js/firebase.js"></script>
  <script type="module" src="../assets/js/guard.js"></script>
  <script type="module" src="../assets/js/admin.js"></script>
  <script type="module">
    import { protectPage } from '../assets/js/guard.js';
    protectPage('admin');
  </script>
  <button onclick="logout()">Logout</button>
  
</body>
</html>
