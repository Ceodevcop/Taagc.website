<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin | TAAGC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h2>TAAGC</h2>

  <a href="/dashboard/admin.html">👑 Admin Dashboard</a>
  <a href="/index.html">🏠 Home</a>

  <hr>

  <strong>Management</strong>
  <a href="#users">👥 Users</a>
  <a href="#stats">📊 Platform Stats</a>

  <hr>
  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <button onclick="toggleSidebar()">☰</button>
  <strong>Super Admin Panel</strong>
</div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">

  <!-- STATS -->
  <section id="stats">
    <h2>📊 Platform Overview</h2>
    <div class="cards">
      <div class="card">Total Users: <span id="totalUsers">0</span></div>
      <div class="card">Clients: <span id="totalClients">0</span></div>
      <div class="card">Investors: <span id="totalInvestors">0</span></div>
    </div>
  </section>

  <br>

  <!-- USERS -->
  <section id="users">
    <h2>👥 User Management</h2>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Change Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </section>

</div>

<script type="module" src="/assets/js/sidebar.js"></script>
<script type="module" src="/assets/js/logout.js"></script>
<script type="module" src="/assets/js/guard-admin.js"></script>
<script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
