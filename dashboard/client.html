<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard - TAAGC</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <h1>Client Dashboard</h1>

  <section>
    <h2>Complete Your Profile</h2>
    <form id="profileForm" onsubmit="submitProfile(); return false;">
      <input type="text" id="fullName" placeholder="Full Name" required>
      <input type="text" id="phone" placeholder="Phone Number" required>
      <input type="text" id="address" placeholder="Address" required>
      <input type="text" id="bankName" placeholder="Bank Name" required>
      <input type="text" id="accountNumber" placeholder="Bank Account Number" required>
      <label>Profile Picture</label>
      <input type="file" id="profilePic" accept="image/*" required>
      <button type="submit">Save Profile</button>
    </form>
  </section>

  <script type="module" src="../assets/js/firebase.js"></script>
  <script type="module" src="../assets/js/client.js"></script>
  <script type="module" src="../assets/js/clientProfile.js"></script>
</body>
</html>
