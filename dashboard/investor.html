<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investor Dashboard - TAAGC</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2 class="brand">TAAGC</h2>
  <a href="investor.html">🏠 Dashboard</a>
  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<!-- Topbar -->
<div class="topbar">
  <button onclick="toggleSidebar()">☰</button>
</div>

<div class="main-content" id="mainContent">
  <h2>Investor Dashboard</h2>
  <p>View your portfolio, investments, and account details.</p>

  <div class="card">
    <h3>Your Portfolio</h3>
    <div id="portfolioList">
      <!-- Portfolio items loaded here -->
    </div>
  </div>

  <div class="card">
    <h3>Account Info</h3>
    <div id="accountInfo">
      <!-- Account info dynamically loaded -->
    </div>
  </div>
</div>

<script type="module" src="../assets/js/sidebar.js"></script>
<script type="module" src="../assets/js/logout.js"></script>
<script type="module" src="../assets/js/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="card">
  <h3>Portfolio Analytics</h3>
  <canvas id="portfolioChart"></canvas>
</div>

<script type="module">
import { auth, db } from "../assets/js/firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

async function loadInvestorPortfolio() {
  const userDoc = await getDoc(doc(db, "investors", auth.currentUser.uid));
  if(userDoc.exists()){
    const data = userDoc.data();
    const ctx = document.getElementById("portfolioChart").getContext("2d");
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: Object.keys(data.portfolio || {}),
        datasets: [{
          label: 'Investments',
          data: Object.values(data.portfolio || {}),
          backgroundColor: ['#1976d2','#0d47a1','#64b5f6','#42a5f5','#90caf9']
        }]
      }
    });
  }
}

loadInvestorPortfolio();
</script>

<script type="module">
import { auth, db } from "../assets/js/firebase.js";
import { protectPage } from "../assets/js/guard.js";
import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

protectPage(["investor"]); // only investor access

const portfolioList = document.getElementById("portfolioList");
const accountInfo = document.getElementById("accountInfo");

async function loadInvestorData() {
  const userDoc = await getDoc(doc(db, "investors", auth.currentUser.uid));
  if(userDoc.exists()) {
    const data = userDoc.data();
    accountInfo.innerHTML = `
      <p>Email: ${auth.currentUser.email}</p>
      <p>Invested Amount: ${data.totalInvested || 0}</p>
      <p>Returns: ${data.returns || 0}</p>
    `;
    
    // Portfolio items
    portfolioList.innerHTML = '';
    if(data.portfolio) {
      Object.keys(data.portfolio).forEach(key => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<p>${key}: ${data.portfolio[key]}</p>`;
        portfolioList.appendChild(div);
      });
    }
  }
}

// Initial load
loadInvestorData();
</script>

</body>
</html>
